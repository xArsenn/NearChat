<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>NearChat Guest</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#080c0d;color:#e8efeb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#173b2c 0,#0b1112 42%,#070a0b 100%)}button,input{font:inherit}.app{width:min(100%,720px);min-height:100vh;margin:auto;display:grid;grid-template-rows:auto 1fr auto;background:rgba(11,16,18,.88);border-inline:1px solid rgba(255,255,255,.06)}header{padding:max(18px,env(safe-area-inset-top)) 18px 15px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.08)}.logo{width:42px;height:42px;display:grid;place-items:center;color:#07110d;background:#71e6b0;border-radius:13px;font-weight:900}.head{min-width:0;flex:1}.head strong,.head span{display:block}.head strong{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.head span{margin-top:3px;color:#7d8b84;font-size:11px}.lang{padding:7px 9px;color:#aebbb5;background:#151d20;border:1px solid rgba(255,255,255,.09);border-radius:9px}#messages{min-height:0;overflow-y:auto;padding:18px}.welcome{margin:12vh auto 0;max-width:390px;text-align:center}.welcome h1{margin:0 0 10px;font-size:24px}.welcome p{margin:0;color:#839089;font-size:13px;line-height:1.7}.join{margin-top:22px;padding:18px;background:#11191b;border:1px solid rgba(255,255,255,.08);border-radius:16px;text-align:left}label{display:block;margin-bottom:7px;color:#9aa7a1;font-size:11px}input[type=text]{width:100%;height:44px;padding:0 12px;color:#ecf3ef;background:#080d0f;border:1px solid rgba(255,255,255,.09);border-radius:10px;outline:0}input:focus{border-color:rgba(113,230,176,.55)}.join button{width:100%;margin-top:10px;padding:12px;color:#07110d;background:#71e6b0;border:0;border-radius:10px;font-weight:800}.status{min-height:18px;margin-top:10px;color:#91a098;font-size:11px;text-align:center}.row{display:flex;margin-bottom:12px}.row.me{justify-content:flex-end}.bubble{max-width:min(82%,520px);padding:10px 12px;background:#172023;border:1px solid rgba(255,255,255,.06);border-radius:5px 14px 14px 14px}.me .bubble{background:#17392c;border-radius:14px 5px 14px 14px}.bubble p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.55}.bubble small{display:block;margin-top:5px;color:#84918b;font-size:9px}.file{display:flex;align-items:center;gap:10px;min-width:210px}.file>span{width:35px;height:35px;display:grid;place-items:center;background:rgba(113,230,176,.1);border-radius:9px}.file div{min-width:0;flex:1}.file strong,.file em{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file strong{font-size:12px}.file em{margin-top:3px;color:#89968f;font-size:9px;font-style:normal}.file a{color:#71e6b0;font-size:11px}footer{padding:12px 14px max(12px,env(safe-area-inset-bottom));display:grid;grid-template-columns:auto 1fr auto;gap:8px;border-top:1px solid rgba(255,255,255,.08);background:rgba(10,15,16,.95)}footer input[type=text]{height:42px}footer button,.file-pick{height:42px;min-width:42px;display:grid;place-items:center;color:#07110d;background:#71e6b0;border:0;border-radius:10px;font-weight:800}.file-pick{color:#b8c5bf;background:#182124;cursor:pointer}.file-pick input{display:none}footer[hidden]{display:none}@media(max-width:520px){.app{border:0}#messages{padding:14px 10px}.bubble{max-width:90%}}
  </style>
</head>
<body>
  <div class="app">
    <header><div class="logo">N</div><div class="head"><strong id="roomName">NearChat</strong><span id="connection">Connecting…</span></div><button class="lang" id="lang">EN</button></header>
    <main id="messages"><section class="welcome" id="welcome"><h1 id="welcomeTitle"></h1><p id="welcomeText"></p><div class="join"><label id="nameLabel" for="name"></label><input id="name" type="text" maxlength="40" /><button id="join"></button><div class="status" id="status"></div></div></section></main>
    <footer id="composer" hidden><label class="file-pick" title="File">＋<input id="file" type="file" /></label><input id="draft" type="text" maxlength="4000" /><button id="send">➤</button></footer>
  </div>
  <script type="module" src="/src/guest.ts"></script>
</body>
</html>
